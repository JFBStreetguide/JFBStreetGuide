<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jamaica Fire Brigade Street Guide and Response System</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JFB Guide">

  <!-- Tesseract.js for OCR Camera Scanning -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --jfb-red: #d32f2f;
      --jfb-gold: #fbc02d;
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-light: #2c2c2c;
      --text: #ffffff;
      --subtext: #b0b0b0;
      --border: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 15px;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--jfb-red);
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 1.2rem;
      color: var(--jfb-gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .search-box {
      width: 100%;
      padding: 12px 15px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 15px;
    }

    .btn {
      background: var(--jfb-red);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-secondary {
      background: var(--surface-light);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .street-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .street-row {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .street-row:hover {
      background: var(--surface-light);
    }

    .street-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
    }

    .street-sub {
      font-size: 0.85rem;
      color: var(--subtext);
    }

    /* Modal / Detail View */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      max-width: 650px;
      margin: 20px auto;
      border-radius: 8px;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field-label {
      font-size: 0.8rem;
      color: var(--jfb-gold);
      text-transform: uppercase;
      font-weight: bold;
    }

    .field-value {
      font-size: 1rem;
      color: #fff;
      background: var(--surface-light);
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    input.field-value, textarea.field-value {
      width: 100%;
      color: #fff;
      background: #111;
      border: 1px solid var(--jfb-gold);
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h1>JFB Street Guide</h1>
    <button class="btn" onclick="openNewModal()">+ Add Street</button>
  </header>

  <input type="text" id="searchInput" class="search-box" placeholder="Search streets, hydrants, or divisions..." oninput="filterStreets()">

  <div id="streetContainer" class="street-list">
    <!-- Street rows render dynamically -->
  </div>

  <!-- Detail / Edit Modal -->
  <div id="detailModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle" style="color: var(--jfb-gold);">Street Details</h2>
        <button class="btn btn-secondary" onclick="closeModal()">Close</button>
      </div>

      <div class="detail-grid">
        <div class="field-group">
          <label class="field-label">Street Name</label>
          <input type="text" id="fieldStreet" class="field-value" readonly>
        </div>
        <div class="field-group">
          <label class="field-label">Location / Division</label>
          <input type="text" id="fieldLocation" class="field-value" readonly>
        </div>
        <div class="field-group">
          <label class="field-label">Hydrant Locations & Grid References</label>
          <textarea id="fieldHydrants" class="field-value" rows="3" readonly></textarea>
        </div>
        <div class="field-group">
          <label class="field-label">Response Details & Remarks</label>
          <textarea id="fieldRemarks" class="field-value" rows="4" readonly></textarea>
        </div>
      </div>

      <div class="actions">
        <button id="editBtn" class="btn btn-secondary" onclick="enableEditing()">Edit Information</button>
        <button id="saveBtn" class="btn" style="display:none;" onclick="saveStreet()">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    // Local state for instant demonstration and editing
    let streetData = [
      { id: '1', name: "Spanish Town Road", location: "Kingston / St. Andrew", hydrants: "Hydrant #12 near industrial park entrance; Grid Ref: H-14", remarks: "Main arterial route. High traffic during peak hours." },
      { id: '2', name: "Half Way Tree Road", location: "St. Andrew", hydrants: "Hydrant opposite clock tower; Grid Ref: C-08", remarks: "Busy commercial district." }
    ];

    let currentEditingId = null;

    function renderList(items) {
      const container = document.getElementById('streetContainer');
      container.innerHTML = '';
      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'street-row';
        row.onclick = () => openModal(item.id);
        row.innerHTML = `
          <div>
            <div class="street-name">${item.name}</div>
            <div class="street-sub">${item.location}</div>
          </div>
          <span style="color: var(--subtext);">&rarr;</span>
        `;
        container.appendChild(row);
      });
    }

    function filterStreets() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = streetData.filter(s => 
        s.name.toLowerCase().includes(q) || 
        s.location.toLowerCase().includes(q) ||
        s.hydrants.toLowerCase().includes(q)
      );
      renderList(filtered);
    }

    function openModal(id) {
      const item = streetData.find(s => s.id === id);
      if (!item) return;

      currentEditingId = id;
      document.getElementById('modalTitle').innerText = "Street Details";
      document.getElementById('fieldStreet').value = item.name;
      document.getElementById('fieldLocation').value = item.location;
      document.getElementById('fieldHydrants').value = item.hydrants;
      document.getElementById('fieldRemarks').value = item.remarks;

      setInputsReadOnly(true);
      document.getElementById('editBtn').style.display = 'inline-block';
      document.getElementById('saveBtn').style.display = 'none';
      document.getElementById('detailModal').style.display = 'block';
    }

    function enableEditing() {
      setInputsReadOnly(false);
      document.getElementById('editBtn').style.display = 'none';
      document.getElementById('saveBtn').style.display = 'inline-block';
    }

    function setInputsReadOnly(isReadOnly) {
      ['fieldStreet', 'fieldLocation', 'fieldHydrants', 'fieldRemarks'].forEach(id => {
        const el = document.getElementById(id);
        if (isReadOnly) {
          el.setAttribute('readonly', 'readonly');
        } else {
          el.removeAttribute('readonly');
        }
      });
    }

    function saveStreet() {
      const name = document.getElementById('fieldStreet').value;
      const location = document.getElementById('fieldLocation').value;
      const hydrants = document.getElementById('fieldHydrants').value;
      const remarks = document.getElementById('fieldRemarks').value;

      if (currentEditingId) {
        // Update existing record
        const item = streetData.find(s => s.id === currentEditingId);
        if (item) {
          item.name = name;
          item.location = location;
          item.hydrants = hydrants;
          item.remarks = remarks;
        }
      } else {
        // Add new record
        streetData.push({
          id: Date.now().toString(),
          name, location, hydrants, remarks
        });
      }

      renderList(streetData);
      closeModal();
    }

    function openNewModal() {
      currentEditingId = null;
      document.getElementById('modalTitle').innerText = "Add New Street";
      document.getElementById('fieldStreet').value = '';
      document.getElementById('fieldLocation').value = '';
      document.getElementById('fieldHydrants').value = '';
      document.getElementById('fieldRemarks').value = '';

      setInputsReadOnly(false);
      document.getElementById('editBtn').style.display = 'none';
      document.getElementById('saveBtn').style.display = 'inline-block';
      document.getElementById('detailModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    // Initial load
    renderList(streetData);
  </script>
</body>
</html>
